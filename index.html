<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Messenger (Fixed)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif !important; -webkit-tap-highlight-color: transparent; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: #fff; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; background: #0e1621; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; background: #0e1621; z-index: 10; overflow-y: auto;}
        .screen.active { display: flex; }

        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(229,62,62,.95); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 99999; opacity: 0; pointer-events: none; transition: .3s; text-align: center; width: 90%; max-width: 300px; font-weight: bold; }
        .toast.show { opacity: 1; top: 40px; }
        .toast.success { background: rgba(56,161,105,.95); }

        @keyframes gift-float { 0% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.05); } 100% { transform: translateY(0) scale(1); } }
        .gift-anim { display: inline-block; animation: gift-float 2s infinite ease-in-out; font-size: 40px;}

        /* АВТОРИЗАЦИЯ */
        .auth-body { display: flex; flex-direction: column; height: 100%; padding-bottom: 90px; }
        .auth-content { padding: 20px; }
        .auth-header { text-align: center; margin: 10px 0 20px; }
        .auth-logo { font-size: 50px; margin-bottom: 10px; }
        .auth-title { font-size: 22px; font-weight: bold; }
        .input-group { margin-bottom: 15px; }
        .input-group input, .search-input, .modal-content input, .admin-card input, .admin-card select, .chat-input-area input { width: 100%; padding: 15px; border: 1px solid #2b5278; background: #17212b; color: #fff; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 10px; }
        .admin-secret-group { display: none; margin-bottom: 15px; background: #2b1d1d; border: 1px solid #e53e3e; border-radius: 10px; padding: 10px; }
        .admin-secret-group.active { display: block; }
        .admin-secret-group textarea { width: 100%; height: 60px; background: #1a1212; color: #ffb3b3; border: none; border-radius: 5px; padding: 10px; outline: none; }
        .error-msg { color: #e53e3e; font-size: 13px; margin-bottom: 10px; display: none; text-align: center; font-weight: bold; }
        .auth-footer { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: #0e1621; border-top: 1px solid #17212b; display: flex; flex-direction: column; gap: 10px; }
        .auth-btn { width: 100%; padding: 18px; background: #2b5278; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-btn.secondary { background: #242f3d; }

        /* ГЛАВНЫЙ ЭКРАН */
        .main-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #17212b; border-bottom: 1px solid #242f3d; }
        .menu-btn, .back-btn, .close-btn { font-size: 24px; color: #7d8b99; cursor: pointer; padding: 5px; background: none; border: none; z-index: 100; position: relative;}
        .header-title { font-size: 18px; font-weight: bold; }
        .header-actions { display: flex; gap: 15px; font-size: 20px; color: #7d8b99; }
        .wallet-bar { background: #17212b; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #242f3d; font-size: 14px; color: #4fa8ff; font-weight: bold; cursor: pointer; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #17212b; cursor: pointer; }
        .avatar-wrapper { position: relative; width: 55px; height: 55px; margin-right: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;}
        .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #fff; background: #2b5278; z-index: 2; overflow: hidden;}
        .avatar img { width: 100%; height: 100%; object-fit: cover;}
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .verified-badge { color: #4fa8ff; font-size: 14px; display: none; }
        .verified-badge.show { display: inline-block; }
        .chat-msg { font-size: 14px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

        /* ЧАТ */
        .chat-header { display: flex; align-items: center; padding: 10px 15px; background: #17212b; gap: 15px; border-bottom: 1px solid #242f3d; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #182533; padding: 10px 15px; border-radius: 10px; max-width: 80%; font-size: 14px; width: fit-content; word-break: break-word; }
        .message.out { background: #2b5278; align-self: flex-end; }
        .chat-input-area { padding: 10px 15px; background: #17212b; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 20px; margin-bottom: 0;}
        .chat-input-area button { background: #2b5278; border: none; color: #fff; padding: 0 20px; border-radius: 20px; cursor: pointer; }

        /* МЕНЮ */
        .menu-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.7); z-index: 900; opacity: 0; pointer-events: none; transition: .3s; }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }
        .side-menu { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: #17212b; z-index: 1000; transition: .3s; display: flex; flex-direction: column; overflow-y: auto;}
        .side-menu.active { left: 0; }
        .profile-section { padding: 20px; border-bottom: 1px solid #242f3d; background: #1c2733; cursor: pointer;}
        .profile-avatar-big { width: 80px; height: 80px; border-radius: 50%; background: #e53e3e; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin-bottom: 10px; overflow: hidden; border: 2px solid #4fa8ff;}
        .menu-items { padding: 10px 0; }
        .menu-item { padding: 15px 20px; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 15px; }
        .menu-item:hover { background: #242f3d; }

        /* ПРОФИЛЬ */
        .profile-bg { height: 130px; position: relative; background-size: cover; background-position: center; }
        .bg-default { background: linear-gradient(135deg, #1c2733, #2b5278); }
        .profile-info { display: flex; flex-direction: column; align-items: center; margin-top: -50px; padding: 0 20px;}
        .avatar-container { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
        .profile-avatar-main { width: 90px; height: 90px; border-radius: 50%; background: #e53e3e; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; border: 4px solid #0e1621; position: relative; z-index: 2; overflow: hidden;}
        .profile-nft-shelf { display: flex; gap: 5px; padding-bottom: 10px;}
        .profile-name-text { font-size: 20px; font-weight: bold; margin-top: 10px; display: flex; align-items: center; gap: 5px;}
        .profile-bio { color: #7d8b99; font-size: 14px; margin-top: 5px; text-align: center;}
        .profile-stats { display: flex; gap: 10px; margin-top: 15px; font-size: 14px; flex-wrap: wrap; justify-content: center;}
        .stat-box { background: #1c2733; padding: 5px 10px; border-radius: 8px; border: 1px solid #242f3d;}
        .stat-box span { color: #4fa8ff; font-weight: bold;}
        .profile-tabs { display: flex; margin-top: 20px; border-bottom: 1px solid #242f3d;}
        .profile-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #7d8b99;}
        .profile-tab.active { color: #4fa8ff; border-bottom: 2px solid #4fa8ff;}
        .profile-content { padding: 20px; }
        
        /* NFT И ПОДАРКИ СЕТКА */
        .nft-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nft-item { background: #1c2733; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #242f3d; display: flex; flex-direction: column; align-items: center;}
        .nft-item .icon { font-size: 40px; }
        .nft-actions { display: flex; gap: 5px; margin-top: 10px; width: 100%;}
        .nft-btn { flex: 1; padding: 5px; font-size: 11px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold;}

        .settings-btn { position: absolute; right: 50px; top: 10px; font-size: 20px; cursor: pointer; color: #4fa8ff;}

        /* МАГАЗИН */
        .admin-content { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .shop-item { background: #1c2733; padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #242f3d; position: relative;}
        .shop-item .icon { font-size: 40px; margin-bottom: 5px;}
        .shop-item .price { font-size: 12px; color: #ecc94b; font-weight: bold; background: #0e1621; padding: 3px 8px; border-radius: 10px; display: inline-block;}
        .crypto-card { background: linear-gradient(135deg, #1c2733, #2b5278); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #4fa8ff; margin-bottom: 20px;}
        
        .empty { color: #7d8b99; font-size: 13px; text-align: center; grid-column: span 3; }
        .my-gifts-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; padding: 15px; }
        .gift-card { background: #1c2733; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #38a169; position: relative; }

        .modal { position: absolute; inset: 0; background: rgba(0,0,0,.8); z-index: 2000; display: none; justify-content: center; align-items: flex-start; padding-top: 60px; }
        .modal.active { display: flex; }
        .modal-content { background: #17212b; width: 90%; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-height: 80vh; overflow-y: auto;}
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; }
        .modal-close { background: none; border: none; color: #7d8b99; font-size: 20px; cursor: pointer; }
        .search-result { background: #1c2733; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .action-btn { background: #2b5278; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div class="toast" id="toast"></div>

    <div class="screen active" id="authScreen">
        <div class="auth-body">
            <div class="auth-content">
                <div class="auth-header">
                    <div class="auth-logo">🛡️</div>
                    <div class="auth-title">Вход в систему</div>
                </div>
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Ваш ник" autocomplete="username">
                    <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password">
                </div>
                <div class="admin-secret-group" id="adminSecretBox">
                    <textarea id="secretPhrase" placeholder="Секретная фраза админа..."></textarea>
                </div>
                <div class="error-msg" id="mainError"></div>
            </div>
            <div class="auth-footer">
                <button type="button" class="auth-btn" id="loginBtn">Войти</button>
                <button type="button" class="auth-btn" id="openRegBtn" style="background: #242f3d;">Регистрация</button>
            </div>
        </div>
    </div>

    <div class="screen" id="mainScreen">
        <div class="main-header">
            <div class="menu-btn" id="menuBtn">☰</div>
            <div class="header-title">Чаты</div>
            <div class="header-actions">
                <span id="openSearchBtn">🔍</span>
                <span id="openCreateBtn">✏️</span>
            </div>
        </div>
        <div class="wallet-bar" id="walletBarBtn">
            <span>💳 Магазин</span>
            <span id="headerBalance">0 💰</span>
        </div>
        <div class="chat-list" id="mainChatList"></div>
    </div>

    <div class="screen" id="profileScreen">
        <div class="main-header">
            <div class="menu-btn" id="closeProfileBtn">←</div>
            <div class="header-title" id="profileHeaderTitle">Мой профиль</div>
            <div class="settings-btn" id="openSettingsBtn" style="display:none;">⚙️</div>
        </div>
        <div class="profile-bg bg-default" id="profileBg"></div>
        <div class="profile-info">
            <div class="avatar-container">
                <div class="profile-avatar-main" id="profileAvatar">U</div>
                <div class="profile-nft-shelf" id="profileNftShelf"></div>
            </div>
            <div class="profile-name-text" id="profileName">User <span class="verified-badge" id="profileVerifyBadge">✔</span></div>
            <div class="profile-bio" id="profileBio">@user • Разработчик</div>
            <div class="profile-stats">
                <div class="stat-box">Coin: <span id="profileBalance">0</span></div>
                <div class="stat-box">USDT: <span id="profileUsdt">0</span></div>
                <div class="stat-box" style="color:#ecc94b;">NEX: <span id="profileNex">0</span></div>
            </div>
        </div>
        <div class="profile-tabs">
            <div class="profile-tab active" onclick="switchProfileTab('gifts', event)">Подарки</div>
            <div class="profile-tab" onclick="switchProfileTab('nft', event)">NFT Коллекция</div>
        </div>
        <div class="profile-content" id="profileContent"></div>
    </div>

    <div class="screen" id="chatScreen">
        <div class="chat-header">
            <div class="back-btn" id="chatBackBtn">←</div>
            <div class="avatar-wrapper"><div class="avatar" id="chatAvatar" style="width:40px;height:40px;font-size:16px;"></div></div>
            <div id="chatClickProfile" style="cursor:pointer;">
                <div style="font-weight:bold;" id="chatName">Имя</div>
                <div style="font-size:12px;color:#7d8b99;" id="chatStatus">онлайн</div>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" placeholder="Сообщение..." id="msgInput">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <div class="screen" id="walletScreen">
        <div class="main-header"><div class="menu-btn" data-back="mainScreen">←</div><div class="header-title">Купить подарок</div><div style="width:24px;"></div></div>
        <div class="admin-content">
            <div class="crypto-card">
                <div style="color:#4fa8ff; font-size:14px;">NEXUS Crypto Wallet</div>
                <div class="crypto-balance" id="cryptoBalance" style="font-size: 36px; font-weight: bold; color: #ecc94b; margin: 10px 0;">0 NEX</div>
            </div>
            <div class="shop-grid" id="giftShopGrid"></div>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header"><span>Регистрация</span><button class="modal-close" data-close="registerModal">✖</button></div>
            <input type="text" id="regName" placeholder="Ник (3–20 символов)">
            <input type="tel" id="regPhone" placeholder="Номер телефона">
            <input type="password" id="regPass" placeholder="Пароль (5-20 символов)">
            <button class="auth-btn" id="registerBtn">Создать аккаунт</button>
        </div>
    </div>

    <div class="modal" id="searchModal">
        <div class="modal-content">
            <div class="modal-header"><span>Поиск</span><button class="modal-close" data-close="searchModal">✖</button></div>
            <input type="text" class="search-input" id="searchInput" placeholder="Введите ник...">
            <div id="searchResults"></div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="side-menu" id="sideMenu">
        <div class="profile-section" id="openProfileMenu">
            <div class="profile-avatar-big" id="menuAvatar">U</div>
            <div class="profile-name"><span id="menuName">User</span><span class="verified-badge" id="menuVerifyBadge">✔</span></div>
            <div style="font-size:13px;color:#7d8b99;" id="menuRole">Роль: Пользователь</div>
        </div>
        <div class="menu-items">
            <div class="menu-item" id="menuProfileBtn">👤 Мой профиль</div>
            <div class="menu-item" id="menuShopBtn">💳 Магазин</div>
            <div class="menu-item" id="logoutBtn" style="color:#e53e3e;margin-top:20px;">🚪 Выйти</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, set, get, update, onValue, onChildAdded, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyBkNR9ZrRFwB39CYlhk2CNz4jWD-WGWuD8", authDomain: "chat-d7385.firebaseapp.com", databaseURL: "https://chat-d7385-default-rtdb.europe-west1.firebasedatabase.app", projectId: "chat-d7385", storageBucket: "chat-d7385.firebasestorage.app", messagingSenderId: "421202112650", appId: "1:421202112650:web:7b53494f3d32fd02a87d73" };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const ADMIN_NICK = "evdo";
    const ADMIN_SECRET = "evdo evdo EVDONKO Misha hi fish popa pops vino Moldova";
    const NAME_RE = /^[a-zа-яё0-9_]{3,20}$/;

    // БАЗА ПОДАРКОВ (ЗАЩИТА ОТ UNDEFINED)
    const DEFAULT_GIFTS = [
        { id: "g1", name: "Сердце", emoji: "❤️", price: 15 },
        { id: "g2", name: "Мишка", emoji: "🧸", price: 15 },
        { id: "g3", name: "Коробка", emoji: "🎁", price: 25 },
        { id: "g4", name: "Роза", emoji: "🌹", price: 25 },
        { id: "g5", name: "Торт", emoji: "🍰", price: 50 }
    ];

    signInAnonymously(auth).catch(console.error);

    const $ = id => document.getElementById(id);
    const normName = s => String(s || "").trim().toLowerCase();
    const chatKey = (a, b) => [a, b].sort().join("_"); 
    const userRef = name => ref(db, "users/" + name);
    const toArr = v => Array.isArray(v) ? v.filter(x => x != null) : Object.values(v || {});

    function toast(msg, ok = false) { const t = $("toast"); t.textContent = msg; t.className = ok ? "toast show success" : "toast show"; clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2500); }
    function showScreen(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); if (id === "mainScreen") renderChatList(); if (id === "walletScreen") renderShop(); }
    const openModal = id => $(id).classList.add("active");
    const closeModal = id => $(id).classList.remove("active");
    
    function toggleMenu(show) { 
        $("sideMenu").classList.toggle("active", show); 
        $("menuOverlay").classList.toggle("active", show); 
    }

    let me = null, profile = null, unsubChat = null, activeChat = null;
    let shopGifts = [...DEFAULT_GIFTS];

    $("usernameInput").addEventListener("input", () => { $("adminSecretBox").classList.toggle("active", normName($("usernameInput").value) === ADMIN_NICK); });
    $("loginBtn").addEventListener("click", () => login(false));
    $("openRegBtn").addEventListener("click", () => openModal("registerModal"));

    window.addEventListener('load', () => {
        // Загрузка подарков с защитой от undefined
        onValue(ref(db, "shop/gifts"), (snap) => {
            if (snap.exists()) {
                let raw = snap.val();
                let arr = [];
                for (let key in raw) {
                    if (raw[key] && raw[key].name && raw[key].emoji) {
                        arr.push({id: key, name: raw[key].name, emoji: raw[key].emoji, price: raw[key].price || 10});
                    }
                }
                if (arr.length > 0) shopGifts = arr;
            }
            if ($("walletScreen").classList.contains('active')) renderShop();
        });

        const savedUser = localStorage.getItem('savedUser');
        if (savedUser) {
            try { const u = JSON.parse(savedUser); $("usernameInput").value = u.name; login(true); } catch(e) { localStorage.removeItem('savedUser'); }
        }
    });

    async function login(isAuto = false) {
        $("mainError").style.display = "none";
        const name = normName($("usernameInput").value);
        const pass = $("passwordInput").value.trim();
        if (!name) return $("mainError").textContent = "Введите ник!";

        try {
            const snap = await get(userRef(name));
            if (!snap.exists()) return $("mainError").textContent = "Аккаунт не найден.";
            
            const data = snap.val();
            if (!isAuto && data.password && data.password !== pass) return $("mainError").textContent = "Неверный пароль!";

            me = { name, role: name === ADMIN_NICK ? "ADMIN" : "USER" };
            profile = data;
            
            onValue(userRef(me.name), snap => {
                profile = snap.val();
                $("headerBalance").textContent = (profile.balance || 0) + " 💰";
                $("menuAvatar").innerHTML = me.name[0].toUpperCase();
                $("menuName").textContent = me.name;
                renderChatList(); 
            });

            showScreen("mainScreen");
            toast("Успешный вход!", true);
            localStorage.setItem('savedUser', JSON.stringify({ name: me.name }));
        } catch (e) { $("mainError").textContent = "Ошибка: " + e.message; }
    }

    // Отрисовка списка чатов
    async function renderChatList() {
        const list = $("mainChatList"); list.innerHTML = "";
        if(!profile || !profile.chats) return;
        const chats = toArr(profile.chats);
        if(chats.length === 0) return list.innerHTML = '<div style="text-align:center; color:#7d8b99; margin-top:50px;">У вас пока нет чатов.<br>Найдите друга через поиск 🔍</div>';
        
        chats.forEach(c => {
            if(!c.name) return;
            const el = document.createElement("div"); el.className = "chat-item";
            el.innerHTML = `<div class="avatar-wrapper"><div class="avatar">${c.name[0].toUpperCase()}</div></div><div class="chat-info"><div class="chat-name">${c.name}</div><div class="chat-msg">Нажмите чтобы открыть</div></div>`;
            el.onclick = () => openChat(c.name, 'онлайн', '#2b5278');
            list.appendChild(el);
        });
    }

    // Поиск
    $("searchInput").addEventListener("input", async () => {
        const q = normName($("searchInput").value); const box = $("searchResults"); box.innerHTML = "";
        if (!q) return;
        const snap = await get(ref(db, "users"));
        if (!snap.exists()) return;
        
        const users = snap.val();
        const names = Object.keys(users).filter(n => n.includes(q));
        if (names.length === 0) return box.innerHTML = '<div class="empty">Не найдено</div>';
        
        names.forEach(n => {
            const row = document.createElement("div"); row.className = "search-result";
            row.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><div class="avatar" style="width:40px;height:40px;margin:0;background:#2b5278;font-size:16px;">${n[0].toUpperCase()}</div><span>${n}</span></div>
            <div style="display:flex; gap:5px;">
                <button class="action-btn btn-write">Написать</button>
                <button class="action-btn btn-prof" style="background:#ed8936;">Профиль</button>
            </div>`;
            
            // Привязка событий напрямую (это чинит кнопки)
            row.querySelector('.btn-write').onclick = () => { closeModal('searchModal'); openChat(n, 'онлайн', '#2b5278'); };
            row.querySelector('.btn-prof').onclick = () => { closeModal('searchModal'); openProfile(n); };
            
            box.appendChild(row);
        });
    });

    // Чат
    async function openChat(target, status, color) {
        activeChat = target; showScreen("chatScreen");
        $("chatName").textContent = target; $("chatStatus").textContent = status;
        $("chatAvatar").textContent = target[0].toUpperCase(); $("chatAvatar").style.background = color;
        $("chatClickProfile").onclick = () => openProfile(target);
        const box = $("chatMessages"); box.innerHTML = "";

        // Сохраняем чат в список
        if (target !== me.name) {
            let chats = toArr(profile.chats);
            if (!chats.find(c => c.name === target)) {
                chats.push({ name: target });
                await update(userRef(me.name), { chats });
            }
        }

        if (unsubChat) unsubChat();
        unsubChat = onChildAdded(ref(db, "chats/" + chatKey(me.name, target)), snap => {
            const m = snap.val(); if (!m) return;
            const div = document.createElement("div");
            div.className = "message" + (m.from === me.name ? " out" : "");
            div.textContent = m.text;
            box.appendChild(div); box.scrollTop = box.scrollHeight;
        });
    }

    $("chatBackBtn").addEventListener("click", () => { if (unsubChat) { unsubChat(); unsubChat = null; } activeChat = null; showScreen("mainScreen"); });
    $("sendBtn").addEventListener("click", async () => {
        const input = $("msgInput"); const text = input.value.trim();
        if (!text || !activeChat) return;
        input.value = "";
        await push(ref(db, "chats/" + chatKey(me.name, activeChat)), { from: me.name, text, time: Date.now() });
    });

    // Профиль
    window.openProfile = async function(targetName) {
        showScreen("profileScreen");
        $("profileHeaderTitle").textContent = targetName === me.name ? "Мой профиль" : "Профиль " + targetName;
        $("openSettingsBtn").style.display = targetName === me.name ? "block" : "none";

        const snap = await get(userRef(targetName));
        if(!snap.exists()) return toast("Профиль не найден");
        const data = snap.val();
        
        $("profileAvatar").innerHTML = targetName[0].toUpperCase();
        $("profileName").innerHTML = targetName + (data.verified ? ' <span class="verified-badge show">✔</span>' : '');
        $("profileBio").textContent = "@" + targetName;
        $("profileBalance").textContent = data.balance || 0;
        $("profileUsdt").textContent = data.usdt || 0;
        $("profileNex").textContent = data.nex || 0;
        
        $("profileContent").innerHTML = '<div class="empty">У пользователя пока нет подарков</div>';
    }

    // Магазин
    async function renderShop() {
        const giftGrid = $("giftShopGrid"); giftGrid.innerHTML = "";
        shopGifts.forEach(g => {
            const el = document.createElement("div"); el.className = "shop-item";
            el.innerHTML = `<div class="icon gift-anim">${g.emoji}</div><div class="price">${g.price} 💰</div>`;
            el.onclick = () => toast("Покупка в разработке");
            giftGrid.appendChild(el);
        });
    }

    // Навигация
    $("menuBtn").addEventListener("click", () => toggleMenu(true));
    $("menuOverlay").addEventListener("click", () => toggleMenu(false));
    $("openSearchBtn").addEventListener("click", () => openModal("searchModal"));
    $("walletBarBtn").addEventListener("click", () => showScreen("walletScreen"));
    $("menuShopBtn").addEventListener("click", () => { toggleMenu(false); showScreen("walletScreen"); });
    $("menuProfileBtn").addEventListener("click", () => { toggleMenu(false); openProfile(me.name); });
    $("openProfileMenu").addEventListener("click", () => { toggleMenu(false); openProfile(me.name); });
    $("closeProfileBtn").addEventListener("click", () => showScreen("mainScreen"));
    $("logoutBtn").addEventListener("click", () => { localStorage.removeItem('savedUser'); location.reload(); });

    document.querySelectorAll("[data-back]").forEach(el => el.onclick = () => showScreen(el.dataset.back));
    document.querySelectorAll("[data-close]").forEach(el => el.onclick = () => closeModal(el.dataset.close));
</script>
</body>
</html>
